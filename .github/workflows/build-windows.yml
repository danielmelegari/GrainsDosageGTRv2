name: Build VST3 - Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'test_*.cpp'
      - 'installer/**'
      - 'INSTALL-WINDOWS.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download pinned VST3 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path 'GrainsDosage/CMakeLists.txt') {
            $project = Join-Path $env:GITHUB_WORKSPACE 'GrainsDosage'
          } elseif (Test-Path 'CMakeLists.txt') {
            $project = $env:GITHUB_WORKSPACE
          } else {
            throw 'GrainsDosage sources not found.'
          }
          "PROJECT_DIR=$project" >> $env:GITHUB_ENV
          $sdk = Join-Path $env:RUNNER_TEMP 'vst3sdk'
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git $sdk
          git -C $sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C $sdk submodule update --init --recursive --depth 1

      - name: Configure and build x64 plugin
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PROJECT_DIR
          cmake --fresh -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DVST3_SDK_ROOT=$env:RUNNER_TEMP/vst3sdk" `
            -DSMTG_CREATE_PLUGIN_LINK=OFF `
            -DGRAINS_BUILD_TESTS=ON `
            -DSMTG_USE_STATIC_CRT=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --parallel 4 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build-windows.log"

      - name: Run regression and GUI tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PROJECT_DIR
          ctest --test-dir build -C Release --output-on-failure
          & (Join-Path $env:PROJECT_DIR 'build/gui-test/Release/aztec_gui_smoke_win.exe')

      - name: Verify and package VST3
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $plugin = Join-Path $env:PROJECT_DIR 'build/VST3/Release/GrainsDosage.vst3'
          $binary = Join-Path $plugin 'Contents/x86_64-win/GrainsDosage.vst3'
          if (!(Test-Path $binary)) { throw "Missing x64 plugin: $binary" }
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Plugin binary is not a valid Windows PE file.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw 'Plugin binary has an invalid PE header offset.'
          }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'Plugin binary is not x64.'
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $archive = Join-Path $dist 'GrainsDosage-Windows10-x64-VST3.zip'
          Compress-Archive -Path $plugin -DestinationPath $archive -Force

      - name: Upload portable VST3 bundle (no installer needed)
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows10-x64-VST3-portable
          path: dist/GrainsDosage-Windows10-x64-VST3.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cmake = Get-Content (Join-Path $env:PROJECT_DIR 'CMakeLists.txt') -Raw
          if ($cmake -notmatch 'project\(GrainsDosage VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Project version not found.'
          }
          $version = $Matches[1]
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          & $iscc "/DAppVersion=$version" "/DProjectDir=$env:PROJECT_DIR" `
            "/DOutputDir=$dist" (Join-Path $env:PROJECT_DIR 'installer/GrainsDosage.iss')
          $setup = Join-Path $dist "GrainsDosage-$version-Windows10-x64-Setup.exe"
          if (!(Test-Path $setup)) { throw 'Installer was not generated.' }
          Copy-Item (Join-Path $env:PROJECT_DIR 'INSTALL-WINDOWS.txt') $dist

      - name: Test installer and uninstaller
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installed = Join-Path $env:CommonProgramFiles 'VST3/GrainsDosage.vst3/Contents/x86_64-win/GrainsDosage.vst3'
          if (Test-Path $installed) { throw 'Unexpected existing installation on the clean runner.' }
          $setup = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist/GrainsDosage-*-Windows10-x64-Setup.exe') -File | Select-Object -First 1).FullName
          if (!$setup) { throw 'Installer executable not found.' }
          $installLog = Join-Path $env:GITHUB_WORKSPACE 'installer-test.log'
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$installLog`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          if (!(Test-Path $installed)) { throw 'Installed plugin binary is missing.' }
          $source = Join-Path $env:PROJECT_DIR 'build/VST3/Release/GrainsDosage.vst3/Contents/x86_64-win/GrainsDosage.vst3'
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash $source).Hash) {
            throw 'Installed plugin differs from the tested build.'
          }
          $uninstaller = Join-Path $env:ProgramFiles 'GrainsDosage/unins000.exe'
          $result = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path $installed)) { throw 'Uninstall verification failed.' }

      - name: Generate checksums
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist') -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE 'dist/SHA256SUMS.txt')

      - name: Upload Windows installer and VST3
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows10-x64-Installer
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build-windows.log
            installer-test.log
            **/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7