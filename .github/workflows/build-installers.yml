name: Build installers

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows-installers:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [full, trial]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          submodules: true
          path: vst3sdk

      - name: Build VST3
        shell: bash
        run: |
          # The trial edition adds -DGRAINS_TRIAL=ON (see trial/TrialGuard.h
          # for the matching CMake snippet).
          if [ "${{ matrix.edition }}" = "trial" ]; then
            cmake -B build-trial -DCMAKE_BUILD_TYPE=Release \
              -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk" -DGRAINS_TRIAL=ON
            cmake --build build-trial --config Release
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk"
            cmake --build build --config Release
          fi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          if "%EDITION%"=="trial" (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\GrainsDosageGTRv2-Trial.iss
          ) else (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\GrainsDosageGTRv2.iss
        env:
          EDITION: ${{ matrix.edition }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.edition }}
          path: dist/*.exe

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          submodules: true          # SDK needs its submodules (base, public.sdk, pluginterfaces...)
          path: vst3sdk
          # Optional: pin to a release tag for reproducible builds, e.g.
          # ref: v3.7.12

      - name: Build VST3 + AU
        shell: bash
        run: |
          # -G Ninja avoids the Xcode-generator OBJCXX rule bug
          # ("CMAKE_OBJCXX_COMPILE_OBJECT not set"). Ninja is preinstalled
          # on GitHub macOS runners. The pkg script auto-finds the built
          # bundles under build/, wherever your project puts them.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVST3_SDK_ROOT="$GITHUB_WORKSPACE/vst3sdk" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release
          # Show where the bundles landed (used by build-pkg.sh, and handy
          # for debugging):
          find build -name "*.vst3" -o -name "*.component" | head -n 10

      - name: Build pkg
        shell: bash
        run: |
          chmod +x installer/macos/build-pkg.sh
          installer/macos/build-pkg.sh "${GITHUB_REF_NAME#v}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.pkg

      # --- Optional: attach installers to the GitHub release ---
      # - name: Attach to release
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: |
      #       dist/*.pkg
      #       dist/*.exe
