name: Build VST3 only (no installer)

# Single workflow that produces ONLY the GrainsDosage.vst3 bundles as zip
# artifacts. No .pkg, no Setup.exe, nothing to install: download the zip,
# unzip it into your VST3 folder and you are done.
#
# Run manually: Actions tab -> "Build VST3 only (no installer)" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'test_*.cpp'
      - 'Presets/**'
      - 'GrainsDosage/**'
      - '.github/workflows/build-vst3.yml'

permissions:
  contents: read

jobs:
  # ─────────────────────────── macOS Intel (x86_64) ───────────────────────────
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.14'
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Locate project sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f GrainsDosage/CMakeLists.txt && -d GrainsDosage/src ]]; then
            project_dir="$GITHUB_WORKSPACE/GrainsDosage"
          elif [[ -f CMakeLists.txt && -d src ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            echo 'GrainsDosage sources not found.' >&2
            exit 1
          fi
          printf 'PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"

      - name: Download tested Steinberg SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C "$RUNNER_TEMP/vst3sdk" submodule update --init --recursive --depth 1

      - name: Configure Intel build for macOS 10.14
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          cmake -S . -B build -G Xcode \
            -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
            -DSMTG_CREATE_PLUGIN_LINK=OFF \
            -DSMTG_BUILD_UNIVERSAL_BINARY=OFF \
            -DGRAINS_BUILD_TESTS=ON

      - name: Build VST3 plugin and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          cmake --build build --config Release --parallel 4 2>&1 | tee "$GITHUB_WORKSPACE/build-macos-intel.log"
          ctest --test-dir build -C Release --output-on-failure

      - name: Sign and package the bare .vst3 bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          plugin="build/VST3/Release/GrainsDosage.vst3"
          binary="$plugin/Contents/MacOS/GrainsDosage"
          test -f "$binary"
          lipo "$binary" -verify_arch x86_64
          codesign --force --sign - --timestamp=none "$plugin"
          codesign --verify --strict "$plugin"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent "$plugin" "$GITHUB_WORKSPACE/dist/GrainsDosage-macOS-x64.vst3.zip"

      - name: Upload VST3 only
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-macOS-Intel-x64-VST3
          path: dist/GrainsDosage-macOS-x64.vst3.zip
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────── Windows x64 ────────────────────────────────
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download pinned VST3 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path 'GrainsDosage/CMakeLists.txt') {
            $project = Join-Path $env:GITHUB_WORKSPACE 'GrainsDosage'
          } elseif (Test-Path 'CMakeLists.txt') {
            $project = $env:GITHUB_WORKSPACE
          } else {
            throw 'GrainsDosage sources not found.'
          }
          "PROJECT_DIR=$project" >> $env:GITHUB_ENV
          $sdk = Join-Path $env:RUNNER_TEMP 'vst3sdk'
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git $sdk
          git -C $sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C $sdk submodule update --init --recursive --depth 1

      - name: Configure and build x64 plugin
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PROJECT_DIR
          cmake --fresh -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DVST3_SDK_ROOT=$env:RUNNER_TEMP/vst3sdk" `
            -DSMTG_CREATE_PLUGIN_LINK=OFF `
            -DGRAINS_BUILD_TESTS=ON `
            -DSMTG_USE_STATIC_CRT=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --parallel 4 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE/build-windows.log"

      - name: Run regression and GUI tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PROJECT_DIR
          ctest --test-dir build -C Release --output-on-failure
          & (Join-Path $env:PROJECT_DIR 'build/gui-test/Release/aztec_gui_smoke_win.exe')

      - name: Verify and package VST3 (zip only, no installer)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $plugin = Join-Path $env:PROJECT_DIR 'build/VST3/Release/GrainsDosage.vst3'
          $binary = Join-Path $plugin 'Contents/x86_64-win/GrainsDosage.vst3'
          if (!(Test-Path $binary)) { throw "Missing x64 plugin: $binary" }
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Plugin binary is not a valid Windows PE file.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw 'Plugin binary has an invalid PE header offset.'
          }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'Plugin binary is not x64.'
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Compress-Archive -Path $plugin -DestinationPath (Join-Path $dist 'GrainsDosage-Windows10-x64.vst3.zip') -Force

      - name: Upload VST3 only
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows10-x64-VST3
          path: dist/GrainsDosage-Windows10-x64.vst3.zip
          if-no-files-found: error
          retention-days: 14
