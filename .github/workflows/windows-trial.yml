name: Windows 14-day trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-trial.yml'
      - '.github/workflows/build-installers.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'installer/**'
      - 'assets/**'
      - 'test_*.cpp'

permissions:
  contents: read

jobs:
  windows-trial:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          submodules: recursive
          path: vst3sdk
      - name: Configure 14-day trial
        run: cmake -S . -B build-trial -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DGRAINS_TRIAL=ON -DGRAINS_BUILD_TESTS=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build and test
        run: |
          cmake --build build-trial --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-trial -C Release --output-on-failure
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package Windows trial installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DTrial /DBuildDir=build-trial installer\GrainsDosage.iss'
      - name: Upload trial installer
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows-x64-14-Day-Trial
          path: dist/*-14-Day-Trial-Setup.exe
          if-no-files-found: error
          retention-days: 14
