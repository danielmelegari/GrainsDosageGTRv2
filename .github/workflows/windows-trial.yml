name: Windows 14-day trial

on:
  workflow_dispatch:
  push:
    branches: [main, work/mockup-purple-skin]
    paths:
      - '.github/workflows/windows-trial.yml'
      - '.gitattributes'
      - '.github/workflows/build-installers.yml'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'installer/**'
      - 'assets/**'
      - 'test_*.cpp'
      - 'tests/**'
      - 'tools/*trial*'
      - 'tools/benchmark_engine.cpp'
      - 'tools/compare_engine_cpu.py'
      - 'TRIAL-REGISTRATION.txt'
      - 'USER-MANUAL.*'
      - 'config/windows-trial-public.b64'

permissions:
  contents: read

jobs:
  windows-trial-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tested VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          submodules: recursive
          path: vst3sdk
      - name: Checkout CPU comparison baseline
        uses: actions/checkout@v4
        with:
          ref: b88e029aaa45c2a26795ad1a242c78e55972c018
          path: cpu-baseline
      - name: Configure test-only trial (never distributed)
        run: cmake -S . -B build-test -DGRAINS_BENCHMARK_BASELINE="$env:GITHUB_WORKSPACE/cpu-baseline" -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DGRAINS_TRIAL=ON -DGRAINS_TRIAL_PUBLIC_KEY_HEADER="$env:GITHUB_WORKSPACE/tests/trial_test_public_key.h" -DGRAINS_BUILD_TESTS=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build and test Windows licensing
        run: |
          cmake --build build-test --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-test -C Release --output-on-failure
      - name: Compare audio CPU and output on the same Windows runner
        run: python tools/compare_engine_cpu.py build-test/Release/grains_benchmark_baseline.exe build-test/Release/grains_benchmark_engine.exe cpu-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-audio-CPU-comparison
          path: cpu-report.txt
      - name: Verify native three-page Windows interface
        run: ./build-test/gui-test/Release/aztec_gui_smoke_win.exe

  windows-trial:
    needs: windows-trial-tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure publisher public key
        env:
          GRAINS_TRIAL_PUBLIC_KEY: ${{ vars.GRAINS_TRIAL_PUBLIC_KEY }}
        run: python tools/configure_trial_key.py "$env:RUNNER_TEMP/trial_public_key.h"
      - name: Checkout tested VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          submodules: recursive
          path: vst3sdk
      - name: Configure 14-day trial
        run: cmake -S . -B build-trial -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DGRAINS_TRIAL=ON -DGRAINS_TRIAL_PUBLIC_KEY_HEADER="$env:RUNNER_TEMP/trial_public_key.h" -DGRAINS_BUILD_TESTS=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build and test
        run: |
          cmake --build build-trial --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-trial -C Release --output-on-failure
      - name: Verify native three-page Windows interface
        run: ./build-trial/gui-test/Release/aztec_gui_smoke_win.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package Windows trial installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DTrial /DBuildDir=build-trial installer\GrainsDosage.iss'
      - name: Upload three-page interface previews
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows-ThreePage-Previews
          path: windows-page-*.png
          if-no-files-found: error
      - name: Upload trial installer
        uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows-x64-ThreePage-14-Day-Trial
          path: dist/*-14-Day-Trial-Setup.exe
          if-no-files-found: error
          retention-days: 14
