name: GrainsDosage — Commercial builds and License Generator
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      macos_trial_only:
        description: Build and validate only the macOS Trial
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'cmake/**'
      - 'tools/**'
      - 'docs/**'
      - 'config/**'
      - 'installer/**'
      - 'test_*'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'USER-MANUAL.*'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: grains-commercial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generator:
    if: ${{ !inputs.macos_trial_only }}
    uses: ./.github/workflows/license-generator.yml
  windows:
    if: ${{ !inputs.macos_trial_only }}
    name: Windows VST3 ${{ matrix.edition }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [trial, licensed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          submodules: recursive
          path: vst3sdk
      - uses: actions/checkout@v4
        with:
          ref: 887577177482f26959c19987f9f09b7a5f12dcb1
          path: cpu-baseline
      - name: Configure existing production public key
        # No private-key secret is used by any build or packaging step.
        run: python tools/configure_trial_key.py "$env:RUNNER_TEMP/trial_public_key.h"
      - name: Configure commercial build from this commit
        run: cmake -S . -B build -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" -DGRAINS_EDITION=${{ matrix.edition }} -DGRAINS_TRIAL_PUBLIC_KEY_HEADER="$env:RUNNER_TEMP/trial_public_key.h" -DGRAINS_BUILD_TESTS=ON -DSMTG_CREATE_PLUGIN_LINK=OFF -DGRAINS_BENCHMARK_BASELINE="$env:GITHUB_WORKSPACE/cpu-baseline"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: DSP, license signatures, machine identity, expiry and state tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Compare CPU and deterministic output with previous engine
        if: matrix.edition == 'trial'
        run: python tools/compare_engine_cpu.py build/Release/grains_benchmark_baseline.exe build/Release/grains_benchmark_engine.exe cpu-report.txt --allow-audio-change
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'trial'
        with:
          name: Windows-audio-CPU-comparison
          path: cpu-report.txt
          if-no-files-found: error
      - name: Native three-page editor and DPI tests
        run: ./build/gui-test/Release/aztec_gui_smoke_win.exe
      - name: Stage signed-license build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/VST3/Release/GrainsDosage.vst3 package/GrainsDosage.vst3 -Recurse
          if ('${{ matrix.edition }}' -eq 'licensed') { Copy-Item build/registration/Release/GrainsDosageRegistration.exe package/ }
          Copy-Item USER-MANUAL.html package/
          if ('${{ matrix.edition }}' -eq 'trial') {
            Copy-Item AUTOMATIC-TRIAL.txt package/
            python tools/check-public-only.py --automatic-trial package
          } else {
            Copy-Item TRIAL-REGISTRATION.txt package/
            python tools/check-public-only.py package
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path package/* -DestinationPath GrainsDosage-Windows-${{ matrix.edition }}-VST3.zip
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          $editionFlag = if ('${{ matrix.edition }}' -eq 'trial') { '/DTrial' } else { '/DLicensed' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $editionFlag /DBuildDir=build installer/GrainsDosage.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-Windows-VST3-${{ matrix.edition }}
          path: |
            GrainsDosage-Windows-${{ matrix.edition }}-VST3.zip
            dist/*Setup.exe
            windows-page-*.png
          if-no-files-found: error
          retention-days: 30
  macos:
    name: macOS AU and VST3 ${{ matrix.edition }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(inputs.macos_trial_only && '["trial"]' || '["trial","licensed"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Native RSA issuance and license lifecycle tests
        run: bash tools/test-license-mac.sh
      - name: Fetch pinned SDKs
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C "$RUNNER_TEMP/vst3sdk" submodule update --init --recursive --depth 1
          git clone https://github.com/apple/AudioUnitSDK.git "$RUNNER_TEMP/AudioUnitSDK"
          git -C "$RUNNER_TEMP/AudioUnitSDK" checkout 53a9a2008aae7fb1b0a9f093dd523b9b12f6c0d9
      - name: Configure same-source universal AU and VST3
        run: >-
          cmake -S . -B build -G Xcode
          -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
          -DSMTG_AUDIOUNIT_SDK_PATH="$RUNNER_TEMP/AudioUnitSDK"
          -DSMTG_ENABLE_AUV2_PLUGIN=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
          -DSMTG_BUILD_UNIVERSAL_BINARY=ON '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 -DGRAINS_EDITION=${{ matrix.edition }}
          -DGRAINS_BUILD_TESTS=ON
          '-DCMAKE_CXX_FLAGS=-Werror=unguarded-availability -Werror=unguarded-availability-new'
          '-DCMAKE_OBJCXX_FLAGS=-Werror=unguarded-availability -Werror=unguarded-availability-new'
      - name: Build AU, VST3 and regression tests
        run: cmake --build build --config Release --parallel 4
      - name: Verify Trial helper in both final bundles
        if: matrix.edition == 'trial'
        run: |
          set -euo pipefail
          cmake --build build --config Release --target grains_stage_trial_helper
          for helper in build/VST3/Release/GrainsDosage.vst3/Contents/Resources/GrainsDosageTrialHelper build/AU/Release/GrainsDosage.component/Contents/Resources/plugin.vst3/Contents/Resources/GrainsDosageTrialHelper; do
            test -x "$helper"
            cmp build/Release/GrainsDosageTrialHelper "$helper"
          done
      - name: Audio and session regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native editor interactions
        run: build/gui-test/Release/aztec_gui_smoke mockup-native-mac.png
      - name: Verify public-only bundles and deployment; sign ad hoc
        run: |
          AU=build/AU/Release/GrainsDosage.component
          VST=build/VST3/Release/GrainsDosage.vst3
          python3 tools/check-au-deployment.py "$AU"
          if [ "${{ matrix.edition }}" = trial ]; then
            python3 tools/check-public-only.py --automatic-trial "$AU" "$VST"
          else
            python3 tools/check-public-only.py "$AU" "$VST"
          fi
          if [ "${{ matrix.edition }}" = trial ]; then
            codesign --force --sign - --timestamp=none "$AU/Contents/Resources/plugin.vst3/Contents/Resources/GrainsDosageTrialHelper"
            codesign --force --sign - --timestamp=none "$VST/Contents/Resources/GrainsDosageTrialHelper"
          fi
          codesign --force --sign - --timestamp=none "$AU/Contents/Resources/plugin.vst3"
          codesign --force --sign - --timestamp=none "$AU"
          codesign --force --sign - --timestamp=none "$VST"
          codesign --verify --deep --strict "$AU"
          codesign --verify --deep --strict "$VST"
      - name: Validate Audio Unit on Intel
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto build/AU/Release/GrainsDosage.component "$HOME/Library/Audio/Plug-Ins/Components/GrainsDosage.component"
          killall -9 AudioComponentRegistrar || true
          python3 tools/run-au-validation.py --diagnostics auval-diagnostics -- arch -x86_64 /usr/bin/auval -v aufx Gdsg Dmeg 2>&1 | tee auval-intel.txt
          grep -F 'AU VALIDATION SUCCEEDED.' auval-intel.txt
      - name: Preserve Intel AU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU-diagnostics-${{ matrix.edition }}-Intel
          path: |
            auval-intel.txt
            auval-diagnostics/
          if-no-files-found: ignore
      - name: Package commercial edition
        run: |
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent build/AU/Release/GrainsDosage.component package/GrainsDosage-${{ matrix.edition }}.component.zip
          ditto -c -k --sequesterRsrc --keepParent build/VST3/Release/GrainsDosage.vst3 package/GrainsDosage-${{ matrix.edition }}.vst3.zip
          cp docs/licensing.md package/READ-ME-FIRST.md
          if [[ "${{ matrix.edition }}" == trial ]]; then cp AUTOMATIC-TRIAL.txt package/; fi
          cp USER-MANUAL.html auval-intel.txt package/
      - uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-${{ matrix.edition }}-macOS
          path: package/
          if-no-files-found: error
          retention-days: 30
  apple-silicon:
    name: Verify shipped AU on Apple Silicon (${{ matrix.edition }})
    needs: macos
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(inputs.macos_trial_only && '["trial"]' || '["trial","licensed"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GrainsDosage-${{ matrix.edition }}-macOS
          path: shipped
      - name: Validate actual distributed archive
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto -x -k shipped/GrainsDosage-${{ matrix.edition }}.component.zip "$HOME/Library/Audio/Plug-Ins/Components"
          AU="$HOME/Library/Audio/Plug-Ins/Components/GrainsDosage.component"
          codesign --verify --deep --strict "$AU"
          python3 tools/check-au-deployment.py "$AU"
          killall -9 AudioComponentRegistrar || true
          python3 tools/run-au-validation.py --diagnostics auval-diagnostics -- arch -arm64 /usr/bin/auval -v aufx Gdsg Dmeg 2>&1 | tee auval-arm64.txt
          grep -F 'AU VALIDATION SUCCEEDED.' auval-arm64.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GrainsDosage-${{ matrix.edition }}-Apple-Silicon-validation
          path: |
            auval-arm64.txt
            auval-diagnostics/
  manual:
    if: ${{ !inputs.macos_trial_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: GrainsDosage-User-and-Publisher-Manuals
          path: |
            USER-MANUAL.html
            USER-MANUAL.md
            docs/license-generator.md
            docs/licensing.md
            docs/commercial-builds.md
